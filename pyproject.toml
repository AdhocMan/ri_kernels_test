[build-system]
requires = [
    "scikit-build-core>=0.10",
    "jax==0.6.0", # Use minimum FFI api to build
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.version = ">=3.20"
cmake.build-type = "Release"
cmake.source-dir = "."
wheel.packages = ["ri_kernels"]
wheel.py-api = "py3"

[[tool.scikit-build.overrides]]
if.env.RI_KERNELS_CUDA = "(?i)1|on|true|yes"
cmake.define.RI_KERNELS_CUDA = "ON"

[[tool.scikit-build.overrides]]
if.env.RI_KERNELS_ROCM = "(?i)1|on|true|yes"
cmake.define.RI_KERNELS_ROCM = "ON"

# ── Project metadata ───────────────────────────────────────────────────────────

[project]
name = "ri_kernels"
version = "0.0.2"
license = {file = "LICENSE"}
readme = "README.md"
authors = [
  {name = "Chris Finlay", email = "christopher.finlay@epfl.ch"},
]
maintainers = [
  {name = "Chris Finlay", email = "christopher.finlay@epfl.ch"}
]
description = "RI Kernels"

requires-python = ">=3.10"
dependencies = [
    "jax>=0.6.0",
]

[project.optional-dependencies]
test  = ["pytest", "pytest-cov"]
cuda12 = ["jax[cuda12]"]
cuda13 = ["jax[cuda13]"]

[project.urls]
Repository = "https://github.com/epfl-radio-astro/ri_kernels.git"


# ── Wheel building ─────────────────────────────────────────────────────────────

[tool.cibuildwheel]
# The libraries are loaded with ctypes, not imported as extension modules, so
# `wheel.py-api = "py3"` above makes one wheel per platform cover all supported
# interpreters. Building for a single CPython therefore produces the complete
# set; without this cibuildwheel would build five byte-identical wheels.
build = "cp312-*"
skip = "*-musllinux_*"
build-frontend = "build"
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos.environment]
# `src/*.cpp` uses <latch>, which libc++ annotates as macOS 11.0+.
MACOSX_DEPLOYMENT_TARGET = "11.0"


# ── Pytest ─────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
log_cli       = true
log_cli_level = "WARNING"

